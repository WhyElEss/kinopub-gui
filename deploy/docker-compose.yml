# kinopub-gui on a home server (tested on a Raspberry Pi 4, Debian 12 arm64).
#
#   docker compose up -d --build
#
# Then open http://<server-ip>:8765 from any machine on the LAN.
#
# WITHOUT a password this app has no accounts: anyone who can reach port 8765
# can browse the mounted filesystem, start downloads and use the signed-in
# kino.pub account. Keep it on the LAN — do not port-forward it.
#
# WITH a password (KINOPUB_AUTH_PASSWORD_HASH in auth.env) every request needs
# a session, LAN included, and the app may also be published on one public
# hostname through the Cloudflare Tunnel below. Set the hash first:
#
#   docker compose run --rm kinopub-gui -hash-password
#
# and paste the line it prints into deploy/auth.env. Two files, not one:
# auth.env holds what the APP needs and is read literally; .env holds what
# COMPOSE substitutes into this file. See README for the whole sequence,
# including the second factor.

services:
  kinopub-gui:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Shown in the UI; the in-app updater is disabled in this build.
        VERSION: nas
    image: kinopub-gui:nas
    container_name: kinopub-gui
    restart: unless-stopped

    # Files are written as this user, so they land in the media library owned by
    # the host account rather than by root.
    user: "1000:1000"

    ports:
      - "8765:8765"

    # The password hash comes from a file of its OWN, and `format: raw` on it is
    # NOT optional.
    #
    # An scrypt hash is $-separated, and compose interpolates ${...} inside env
    # values — env_file included, which is the part that is easy to get wrong
    # and was, once. `$iwiQfO…` reads as a variable reference and expands to
    # nothing, and compose says so only as a warning. The app then refuses to
    # start rather than serving with a password nobody could match, which is
    # how this was caught; `format: raw` is what stops it happening at all.
    #
    # Needs compose v2.24+. On an older one, escape every $ in the hash as $$.
    #
    # A file of its own rather than .env for a second reason: .env carries
    # TUNNEL_TOKEN, and this container has no business holding it. Nothing here
    # should be able to stand up the tunnel.
    env_file:
      - path: auth.env
        format: raw
        required: false

    environment:
      - TZ=America/Toronto
      # First-run default for the output folder — inside the container, so it
      # names the mount below rather than a home directory that isn't mounted.
      - KINOPUB_OUTPUT_DIR=/media
      # The one public name this server answers to, on top of loopback and the
      # LAN. Empty unless a tunnel is in front of it. The server REFUSES TO
      # START with this set and no password configured: an unauthenticated
      # kinopub-gui on a public hostname is the one failure that must be
      # impossible, so this line and the hash in auth.env stand or fall
      # together.
      - KINOPUB_PUBLIC_HOST=${KINOPUB_PUBLIC_HOST:-}

    volumes:
      # Settings, encrypted kino.pub credentials, and the second-factor secret
      # (totp.json, 0600) once one is enrolled from the UI. A named volume
      # rather than a path inside the repo: a checkout or an rsync of the
      # sources must never be able to wipe the saved login. Read it with
      #   docker run --rm -v kinopub-config:/c alpine cat /c/kinopub/gui.json
      - kinopub-config:/config
      # The media library the downloads go into. The folder picker in the UI
      # browses the container's filesystem, so what is mounted here is exactly
      # what can be chosen as an output folder.
      - /mnt/share/Media:/media
      # The credential file is encrypted with a key derived from /etc/machine-id.
      # Without this mount the container falls back to the host's boot id, which
      # changes on every reboot — and the saved login would be lost each time.
      - /etc/machine-id:/etc/machine-id:ro

  # The public endpoint, in THIS compose project rather than a directory of its
  # own, so `update-all-docker.sh` (which finds projects by docker-compose.yml)
  # keeps the image current and so the tunnel is recreated with the app it
  # fronts. Same arrangement as the feedgen box.
  #
  # The tunnel's Service URL is http://kinopub-gui:8765 — the container name on
  # this project's own network, so the origin is reached without going back out
  # through the host's published port.
  #
  # TUNNEL_TOKEN lives in .env (mode 0600, and NOT in auth.env — the app has no
  # business holding it) and NEVER on the command line, where
  # `ps` would show it to every user on the box. With no .env this service
  # starts, finds no token and restarts in a loop; comment it out for a
  # LAN-only install.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-kinopub
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - kinopub-gui

volumes:
  kinopub-config:
